services:
  - type: web
    name: motif-backend
    runtime: docker
    rootDir: backend
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: MOTIF_COLLECTION
        value: MotifChunk
      - key: EMBEDDING_PROVIDER
        value: local
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
